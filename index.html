<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Porto Bybit — Pelacak Portofolio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Porto">
<meta name="theme-color" content="#F6F5F1">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#F6F5F1;
  --card:#FFFFFF;
  --text:#20242B;
  --muted:#767B85;
  --border:#E7E5DF;
  --primary:#5B6EF5;
  --primary-dark:#4557D9;
  --primary-soft:#EEF0FE;
  --accent:#7BC9A6;
  --accent-soft:#E9F6EF;
  --warn:#E8A33D;
  --warn-soft:#FBF1DF;
  --danger:#E0614F;
  --danger-soft:#FBEAE7;
  --grey-soft:#EEEEEC;
  --radius:16px;
  --radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overscroll-behavior-y:none;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.45;
  width:100%;
  overflow-x:hidden;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 12px);}
a{color:inherit;}
button{font-family:inherit;}
h1,h2,h3,p{margin:0;}

.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(246,245,241,0.92);
  backdrop-filter:blur(10px);
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
}
.topbar .back-btn{
  width:36px;height:36px;border-radius:10px;border:none;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);
  flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,0.05);
}
.topbar h1{font-size:18px;font-weight:700;flex:1;}
.topbar .top-action{
  border:none;background:none;color:var(--primary);font-weight:600;font-size:14px;padding:8px;min-height:36px;
}

.screen{display:none;padding:14px 16px 6px;}
.screen.active{display:block;}

.card{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  padding:16px;
  margin-bottom:12px;
}
.card-tight{padding:12px 14px;}
.card-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:8px;}
.section-title{font-size:15px;font-weight:700;margin:18px 2px 8px;display:flex;align-items:center;justify-content:space-between;}
.section-title .link{font-size:13px;font-weight:600;color:var(--primary);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.pos{color:#2E7D5B;}
.neg{color:#B23F2E;}

.hero{
  background:linear-gradient(135deg,var(--primary) 0%,#7C8CF8 100%);
  color:#fff;border-radius:20px;padding:20px 18px;margin-bottom:14px;
}
.hero .lbl{opacity:0.85;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
.hero .amount{font-size:28px;font-weight:800;margin-top:4px;}
.hero .sub-row{margin-top:12px;display:flex;gap:10px;}
.hero .sub-box{background:rgba(255,255,255,0.16);border-radius:12px;padding:9px 8px;flex:1;min-width:0;overflow:hidden;}
.hero .sub-box .num{font-size:15px;font-weight:800;overflow-wrap:break-word;}
.hero .sub-box .lbl2{font-size:10.5px;opacity:0.85;text-transform:uppercase;letter-spacing:0.03em;margin-top:1px;}
.hero .updated{margin-top:10px;font-size:11.5px;opacity:0.8;}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;min-width:0;overflow:hidden;}
.stat-card .stat-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.02em;overflow-wrap:break-word;}
.stat-card .stat-value{font-size:15px;font-weight:800;margin-top:4px;overflow-wrap:break-word;}
.stat-card .stat-value.empty{font-size:12.5px;color:var(--muted);font-weight:600;}
.stat-card .stat-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}

.next-action{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--card);margin-bottom:12px;}
.next-action .icon{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.next-action .body{flex:1;min-width:0;}
.next-action .title{font-weight:700;font-size:14px;}
.next-action .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.next-action .chev{color:var(--muted);}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:100px;white-space:nowrap;}
.badge-ok{background:var(--accent-soft);color:#2E7D5B;}
.badge-warn{background:var(--warn-soft);color:#95660E;}
.badge-danger{background:var(--danger-soft);color:#B23F2E;}
.badge-grey{background:var(--grey-soft);color:var(--muted);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:none;font-weight:700;font-size:14.5px;cursor:pointer;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-secondary{background:var(--primary-soft);color:var(--primary-dark);}
.btn-outline{background:var(--card);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:var(--danger-soft);color:#B23F2E;}
.btn-block{width:100%;}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px;}
.icon-btn{width:32px;height:32px;border-radius:9px;border:none;background:var(--grey-soft);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}

.qa-scroll{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.qa-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid var(--border);background:var(--card);min-height:64px;}
.qa-btn .qa-icon{font-size:19px;}
.qa-btn .qa-label{font-size:11px;font-weight:700;text-align:center;line-height:1.2;}

.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.list-item .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:5px;align-self:flex-start;}
.list-item .body{flex:1;min-width:0;}
.list-item .title{font-weight:700;font-size:13.5px;}
.list-item .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.list-item .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:right;}

.record-row{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--card);}
.record-row .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.record-row .row-title{font-weight:700;font-size:14px;}
.record-row .row-date{font-size:12px;color:var(--muted);margin-top:2px;}
.record-row .row-detail{margin-top:8px;font-size:13px;color:var(--text);}
.record-row .row-detail .k{color:var(--muted);}
.row-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin-top:8px;font-size:12.5px;}
.row-grid .k{color:var(--muted);margin-bottom:2px;}
.record-row .row-actions{display:flex;gap:8px;margin-top:10px;}

.empty-state{text-align:center;padding:30px 14px;color:var(--muted);}
.empty-state .icon{font-size:30px;margin-bottom:8px;}
.empty-state .title{font-weight:700;color:var(--text);font-size:14.5px;margin-bottom:4px;}
.empty-state .desc{font-size:13px;line-height:1.5;}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,0.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + var(--safe-bottom));
  max-width:520px;margin:0 auto;
}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);flex:1;min-height:48px;padding:2px;border-radius:10px;}
.nav-btn.active{color:var(--primary);}
.nav-btn .nav-icon{font-size:20px;}
.nav-btn .nav-label{font-size:10.5px;font-weight:700;}

.more-list .more-item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);}
.more-list .more-item:last-child{border-bottom:none;}
.more-list .more-item .ic{width:36px;height:36px;border-radius:10px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.more-list .more-item .txt{flex:1;}
.more-list .more-item .txt .t{font-weight:700;font-size:14px;}
.more-list .more-item .txt .d{font-size:12px;color:var(--muted);margin-top:1px;}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,20,25,0.42);z-index:100;display:none;align-items:flex-end;}
.modal-backdrop.active{display:flex;}
.modal-sheet{
  background:var(--bg);width:100%;max-width:520px;margin:0 auto;
  border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;
  padding:14px 16px calc(20px + var(--safe-bottom));
  animation:slideup 0.18s ease-out;
}
@keyframes slideup{from{transform:translateY(24px);opacity:0.6;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:2px auto 12px;}
.modal-title{font-size:17px;font-weight:800;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--border);background:var(--card);border-radius:12px;
  padding:11px 12px;font-size:15px;color:var(--text);min-height:44px;font-family:inherit;
}
.field textarea{min-height:110px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.modal-actions .btn{flex:1;}

.banner{
  position:fixed;top:calc(var(--safe-top) + 8px);left:12px;right:12px;max-width:496px;margin:0 auto;z-index:90;
  background:var(--text);color:#fff;border-radius:14px;padding:12px 14px;display:none;gap:10px;align-items:flex-start;
  box-shadow:0 8px 24px rgba(0,0,0,0.18);
}
.banner.active{display:flex;}
.banner.danger{background:#B23F2E;}
.banner .b-icon{font-size:17px;}
.banner .b-body{flex:1;font-size:13px;}
.banner .b-close{background:none;border:none;color:#fff;opacity:0.7;font-size:16px;padding:2px 4px;}

.pos-card{border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--card);}
.pos-card.risk-danger{border-color:var(--danger);background:linear-gradient(180deg,var(--danger-soft) 0%,var(--card) 60px);}
.pos-card .pc-top{display:flex;justify-content:space-between;align-items:center;}
.pos-card .pc-sym{font-weight:800;font-size:15px;}
.pos-card .pc-side{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;}
.pos-card .pc-side.long{background:var(--accent-soft);color:#2E7D5B;}
.pos-card .pc-side.short{background:var(--danger-soft);color:#B23F2E;}
.pos-card .pc-pnl{font-weight:800;font-size:15px;}
.pos-card .pc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;}
.pos-card .pc-grid .g-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.02em;}
.pos-card .pc-grid .g-val{font-size:13px;font-weight:700;margin-top:2px;overflow-wrap:break-word;}
.pos-card .mm-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.mm-bar{flex:1;height:8px;background:var(--grey-soft);border-radius:6px;margin:0 10px;overflow:hidden;position:relative;}
.mm-bar .fill{height:100%;border-radius:6px;}
.mm-bar .threshold{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:0.5;}

.chart-wrap{width:100%;overflow:visible;}
.tab-row{display:flex;gap:8px;margin-bottom:12px;}
.tab-btn{flex:1;border:1px solid var(--border);background:var(--card);border-radius:100px;padding:9px 10px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;min-height:38px;}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.disclaimer{font-size:11px;color:var(--muted);line-height:1.5;padding:10px 12px;background:var(--grey-soft);border-radius:12px;margin-top:14px;}
</style>
</head>
<body>
<div id="app">

  <div class="banner" id="reminderBanner">
    <div class="b-icon">⚠️</div>
    <div class="b-body" id="reminderBannerText"></div>
    <button class="b-close" onclick="closeBanner()">✕</button>
  </div>

  <div class="topbar">
    <button class="back-btn" id="backBtn" style="display:none" onclick="goBack()">‹</button>
    <h1 id="screenTitle">Porto</h1>
    <button class="top-action" id="topAction" style="display:none"></button>
  </div>

  <div id="screens"></div>

  <div class="bottom-nav">
    <button class="nav-btn" data-nav="home" onclick="navTo('home')"><span class="nav-icon">🏠</span><span class="nav-label">Beranda</span></button>
    <button class="nav-btn" data-nav="futures" onclick="navTo('futures')"><span class="nav-icon">📊</span><span class="nav-label">Futures</span></button>
    <button class="nav-btn" data-nav="assets" onclick="navTo('assets')"><span class="nav-icon">🪙</span><span class="nav-label">Aset</span></button>
    <button class="nav-btn" data-nav="history" onclick="navTo('history')"><span class="nav-icon">🕒</span><span class="nav-label">Riwayat</span></button>
    <button class="nav-btn" data-nav="more" onclick="navTo('more')"><span class="nav-icon">☰</span><span class="nav-label">Lainnya</span></button>
  </div>

</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<script src="app.js"></script>
</body>
</html>
